```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>UI Design Collage</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    .design-collage {
      min-height: 500px;
    }

    .design-card {
      width: 280px;
      position: absolute;
      transition: transform 0.3s ease;
    }

    .design-card img {
      width: 100%;
      height: 360px;
      object-fit: cover;
    }

    .design-1 {
      left: 5%;
      top: 80px;
      transform: rotate(-9deg);
      z-index: 1;
    }

    .design-2 {
      left: 25%;
      top: 35px;
      transform: rotate(3deg);
      z-index: 3;
    }

    .design-3 {
      left: 48%;
      top: 85px;
      transform: rotate(9deg);
      z-index: 2;
    }

    .design-card:hover {
      z-index: 10;
      transform: rotate(0deg) translateY(-15px);
    }

    @media (max-width: 767px) {
      .design-collage {
        min-height: 430px;
      }

      .design-card {
        width: 190px;
      }

      .design-card img {
        height: 270px;
      }

      .design-1 {
        left: 0;
        top: 80px;
      }

      .design-2 {
        left: 20%;
        top: 35px;
      }

      .design-3 {
        left: 40%;
        top: 80px;
      }
    }
  </style>
</head>

<body>

<section class="py-5 bg-light">

  <div class="container">

    <div class="row align-items-center g-5">

      <!-- Text -->
      <div class="col-lg-5">

        <span class="badge text-bg-dark mb-3">
          UI Designs
        </span>

        <h2 class="display-5 fw-bold mb-3">
          Designs made for different ideas
        </h2>

        <p class="text-secondary mb-4">
          Explore a collection of simple, modern and responsive
          website designs created for businesses, creators and
          professionals.
        </p>

        <a href="#" class="btn btn-dark px-4">
          Explore Designs
        </a>

      </div>


      <!-- Collage -->
      <div class="col-lg-7">

        <div class="design-collage position-relative">

          <!-- Design 1 -->
          <div class="design-card design-1">

            <div class="card border-0 shadow-lg overflow-hidden">

              <img
                src="https://placehold.co/600x800"
                alt="Portfolio website design"
                class="card-img-top"
              >

              <div class="card-body bg-white">
                <h6 class="fw-bold mb-1">
                  Portfolio
                </h6>

                <small class="text-secondary">
                  Creative Website
                </small>
              </div>

            </div>

          </div>


          <!-- Design 2 -->
          <div class="design-card design-2">

            <div class="card border-0 shadow-lg overflow-hidden">

              <img
                src="https://placehold.co/600x800"
                alt="Business website design"
                class="card-img-top"
              >

              <div class="card-body bg-white">
                <h6 class="fw-bold mb-1">
                  Business
                </h6>

                <small class="text-secondary">
                  Business Website
                </small>
              </div>

            </div>

          </div>


          <!-- Design 3 -->
          <div class="design-card design-3">

            <div class="card border-0 shadow-lg overflow-hidden">

              <img
                src="https://placehold.co/600x800"
                alt="Product catalogue design"
                class="card-img-top"
              >

              <div class="card-body bg-white">
                <h6 class="fw-bold mb-1">
                  Catalogue
                </h6>

                <small class="text-secondary">
                  Product Catalogue
                </small>
              </div>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</section>

</body>
</html>
```
